name: CD  

on:  
    workflow_run: 
        workflows: ['ci'] 
        types: [completed]
        branches: 
            - 'main'
jobs:
    diploy:
     runs-on: ip-10-0-25-34
     steps: 
     - name: Code Checkout
       uses: actions/checkout@v7
     - name: Copy Example Env to main Env
       uses: cp.env.example .env

     - name: Docker Login
       uses: docker/login-action@v4
       with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

     - name: Deploy the containers with Docker Compose
       run:
        docker compose pull
        docker compose up -d

     
  
