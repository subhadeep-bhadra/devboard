
name: ci

on:
  push:
    branches: [feat/matrix-docker-build]

jobs:
  Lint-frontend:
    runs-on: ubuntu-latest

    steps:
      # Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Setup NodeJS
      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Install npm packages
      - name: Install npm packages
        working-directory: frontend  
        run: npm install

      # Run Linter
      - name: Run Linter
        working-directory: frontend
        run: npm run lint
    

      # Run Test
      - name: Run Test
        working-directory: frontend
        run: npm run test
        
          
  Lint-backend:
    runs-on: ubuntu-latest
    
    steps:
      # Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v7

      # Setup NodeJS
      - name: Setup NodeJS
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.0'
          go-version-file: 'go.mod'
          cache-dependency-path: go.sum

      - name: Run Go Formatter
        run: go fmt
        working-directory: backend   

      - name: Run Go Vet
        run: go vet
        working-directory: backend  

      - name: Run Tests
        run: go test
        working-directory: backend 

  build-and-push:
    needs: [Lint-frontend,Lint-backend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
       Folder: ['Frontend','Backend']

    steps:
      # Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Docker Setup Login
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Docker Build and Push
        uses: docker/build-push-action@v7
        with:
          context: ./${{matrix.Folder}}
        
          push: true
          tags: ${{ vars.DOCKER_USERNAME }}/devbord-${{matrix.Folder}}:latest
  diploy:
       needs: [Lint-frontend,Lint-backend,build-and-push]
       uses: ./.github/workflows/cd.yml
       secrets: inherit
     




 


