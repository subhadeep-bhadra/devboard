
name: CI

on:
  push:
    branches: [advanced]

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      # Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Setup NodeJS
      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Install npm packages
      - name: Install npm packages
        run: npm install
        working-directory: frontend

      # Run Linter
      - name: Run Linter
        run: npm run lint
        working-directory: frontend

      # Run Test
      - name: Run Test
        run: npm run test
        working-directory: frontend
