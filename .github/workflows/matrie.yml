name: Go Linter 
on:
  push:
   paths:
        - '**'
        - '.github/workflows/matrie.yml**'
   branches: [main]
  

jobs:
  code-format:
    runs-on: ubuntu-latest
    strategy:
          fail-fast: false
          matrix: 
              rt: ['1.26','1.22','1.23']
    steps:
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{matrix.rt}}
          go-version-file: 'go.mod'
          cache-dependency-path: go.sum

      - name: Run Go Formatter
        run: go fmt
        working-directory: backend   

      - name: Run Go Vet
        run: go vet
        working-directory: backend  
